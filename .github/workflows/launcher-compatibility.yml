name: ZettaBridge Android APK and compatibility tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/launcher/**"
      - "core/**"
      - "guest/**"
      - "tools/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "tests/launcher/**"
      - ".github/workflows/launcher-compatibility.yml"
  push:
    branches: [codex/permission-compatibility-layer]
    paths:
      - "android/launcher/**"
      - "core/**"
      - "guest/**"
      - "tools/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "tests/launcher/**"
      - ".github/workflows/launcher-compatibility.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build arm64 APK and run compatibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and Dynarmic
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs libboost-dev ninja-build unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API, build tools, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Configure NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOST=linux-x86_64" >> "$GITHUB_ENV"

      - name: Apply required Dynarmic compatibility patches
        run: |
          git -C third_party/dynarmic apply \
            "$GITHUB_WORKSPACE/third_party/patches/dynarmic-0001-thumb32-armv8.patch" \
            "$GITHUB_WORKSPACE/third_party/patches/dynarmic-0002-asimd-narrowing.patch"

      - name: Run launcher permission contract tests
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
        run: tests/launcher/run_tests.sh

      - name: Compile every launcher Java source
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
        run: tests/launcher/compile_launcher.sh

      - name: Build the ARM32 guest runtime
        run: tools/build_guest.sh

      - name: Extract the ARM32 Android system libraries
        run: tools/extract_sysroot.sh

      - name: Configure the Android ARM64 native build
        run: |
          mkdir -p build/boost-headers
          ln -sfn /usr/include/boost build/boost-headers/boost
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZB_BUILD_TESTS=OFF \
            -DBoost_INCLUDE_DIR="$GITHUB_WORKSPACE/build/boost-headers"

      - name: Build native translator and ART proxy
        run: ninja -C build/android-arm64 zbridge zbproxy

      - name: Assemble and validate launcher runtime bundle
        run: tools/make_launcher_bundle.sh

      - name: Build installable debug APK
        working-directory: android/launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contents and signature
        run: |
          APK="android/launcher/app/build/outputs/apk/debug/app-debug.apk"
          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          required = {
              "lib/arm64-v8a/libzbridge.so",
              "assets/zb-files.txt",
              "assets/zb-version.txt",
              "assets/zb/guest/zbhost",
              "assets/zb/guest/lib/libzbjni.so",
              "assets/zb/sysroot/system/bin/linker",
              "assets/zb/host/libzbproxy.so",
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("APK is missing required runtime files: " + ", ".join(missing))
              if not any(name.startswith("assets/zb/sysroot/system/lib/") for name in names):
                  raise SystemExit("APK is missing the ARM32 system libraries")
          print("APK contents PASS: ARM64 translator, ARM32 runtime and system libraries are packaged")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZettaBridge-debug-apk
          path: android/launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
